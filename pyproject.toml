[tool.poetry]
name = "reqres-tests"
version = "0.1.0"
description = "API testing project for ReqRes"
authors = ["Tatiana <90062565+tatafitz@users.noreply.github.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.3.5"
setuptools = "^75.0.0"
requests = "^2.32.3"
fastapi = "^0.115.11"
uvicorn = "^0.34.0"
email-validator = "^2.1.0"
python-dotenv = "^1.0.1"
fastapi-pagination = "^0.12.17"
pydantic = "^2.10.0"
sqlalchemy = "^2.0.43"
sqlmodel = "^0.0.24"
psycopg2-binary = "^2.9.0"
asyncpg = "^0.30.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"

[tool.ruff]
# Длина строки
line-length = 88
# Целевая версия Python
target-version = "py311"

# Исключаемые файлы и директории
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]
# Включаемые правила
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL", # pylint
    "RUF", # ruff-specific rules
]

# Игнорируемые правила
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
    "PLR0913", # too many arguments
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "RUF002", # ambiguous unicode characters (кириллица в docstring)
    "E402", #  Module level import not at top of file
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["PLR2004", "S101", "ARG", "FBT"]

[tool.ruff.format]
# Использовать одинарные кавычки
quote-style = "double"
# Использовать пробелы вместо табов
indent-style = "space"
# Пропускать магические завершающие запятые
skip-magic-trailing-comma = false
# Форматировать строки документации
docstring-code-format = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
