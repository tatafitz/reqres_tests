version: '3.9'

services:
  app:
    build: .
    environment:
      DATABASE_ENGINE: postgresql+psycopg2://postgres:123456789@db:5432/postgres
      DATABASE_POOL_SIZE: 10
    ports:
      - 8002:80
    depends_on:
      - db

  db:
    image: postgres
    restart: always
    ports:
      - "5433:5432"
    shm_size: 128mb
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    volumes:
      - db_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  db_data: